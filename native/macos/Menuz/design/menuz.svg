<?xml version="1.0" encoding="UTF-8"?>
<!-- menuz's app icon (ST0027 D13): the mark of menuz-mark.svg in white on
     macOS's rounded square, 1024 units with the system's 100-unit margin.
     bin/devbin macos app-icons rasterises it into AppIcon. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4655D6"/>
      <stop offset="1" stop-color="#1B8F9C"/>
    </linearGradient>
    <mask id="cut">
      <rect x="152" y="96" width="720" height="832" rx="120" fill="#fff"/>
      <rect x="262" y="222" width="400" height="104" rx="52" fill="#000"/>
      <rect x="212" y="408" width="600" height="208" rx="72" fill="#000"/>
      <path d="M300 458 L404 512 L300 566" fill="none" stroke="#fff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="450" y="486" width="246" height="52" rx="26" fill="#fff"/>
      <rect x="262" y="698" width="500" height="104" rx="52" fill="#000"/>
    </mask>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ground)"/>
  <g transform="translate(512 512) scale(0.62) translate(-512 -512)">
    <rect width="1024" height="1024" fill="#fff" mask="url(#cut)"/>
  </g>
</svg>
