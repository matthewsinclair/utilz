<?xml version="1.0" encoding="UTF-8"?>
<!-- menuz's mark (ST0027 D13): a dropped menu, its middle item selected, a
     prompt on it. Black on transparent, the template the menu bar tints.
     bin/devbin macos app-icons rasterises it into MenuBarIcon. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <mask id="cut">
    <rect x="152" y="96" width="720" height="832" rx="120" fill="#fff"/>
    <rect x="262" y="222" width="400" height="104" rx="52" fill="#000"/>
    <rect x="212" y="408" width="600" height="208" rx="72" fill="#000"/>
    <path d="M300 458 L404 512 L300 566" fill="none" stroke="#fff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="450" y="486" width="246" height="52" rx="26" fill="#fff"/>
    <rect x="262" y="698" width="500" height="104" rx="52" fill="#000"/>
  </mask>
  <rect width="1024" height="1024" fill="#000" mask="url(#cut)"/>
</svg>
