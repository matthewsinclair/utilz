<!-- Appended to a built artifact to measure whether a theme is actually READABLE.
     Not a standalone page: the acceptance runner concatenates a deck and this,
     then reads #probe out of a headless --dump-dom.

     WHY THIS EXISTS. "The theme looks fine" is not a check, and the failures it
     catches all present as a plausible-looking slide: steampunk's heading on a
     dark background measured 1.1:1 -- invisible -- and 8bit's headings measured
     2.4:1 in light mode, which an eyeball calls "a bit washed out" rather than a
     defect. Both shipped past a suite that held every theme to the class
     vocabulary, the namespace and the offline rule, because none of those
     answers "can anyone read it".

     TWO REPAIRS, 29 Aug 2026, both found by vc, and the first invalidated every
     number this probe had ever produced.

     1. It selected the FIRST h1/h2/h3/p/li per slide (querySelector, singular).
        Headings use --gp-fg at full strength, so the probe reached the most
        legible element on each slide and reported it as "worst text contrast".
        The pack's real figures are roughly 3x lower: mono measured 16.5 and is
        actually 4.92, which makes IT the theme nearest the floor rather than
        8bit at 5.4. --gp-muted is the token at risk across every theme, by
        definition the dimmest thing a theme declares, and it was the one
        element class the selector never reached.

     2. A slide with no text element hit a bare `continue` -- no entry, no
        marker, nothing counted. A full-bleed image slide, a raw-HTML
        escape-hatch composition, a diagram-only slide: all invisible, and the
        theme still reported a clean measurement. That is the same silent skip
        killed one level up with `unchecked` and `--strict`, surviving one level
        down inside the probe the suite trusts. Such slides now emit UNMEASURED
        and AT08 counts them.

     It reports, per slide, the WORST contrast ratio across every text element
     against its nearest painted ancestor background, plus whether the slide's
     content overflows its box. Navigating to each slide first is mandatory: a
     hidden slide has no layout, so its overflow reading is meaningless and its
     computed styles can be too. -->
<div id="probe">pending</div>
<script>
(async function () {
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  await wait(900);

  // WCAG relative luminance, so the number means what everyone else means by it.
  var luminance = function (colour) {
    var parts = colour.match(/\d+(\.\d+)?/g).map(Number).slice(0, 3);
    var linear = parts.map(function (v) {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * linear[0] + 0.7152 * linear[1] + 0.0722 * linear[2];
  };

  // The nearest ancestor that actually paints. An element's own background is
  // usually transparent, and comparing text to "transparent" is how a contrast
  // check quietly measures nothing.
  var painted = function (el) {
    for (var node = el; node; node = node.parentElement) {
      var colour = getComputedStyle(node).backgroundColor;
      if (colour && !/rgba?\(0, 0, 0, 0\)|transparent/.test(colour)) { return colour; }
    }
    return getComputedStyle(document.body).backgroundColor;
  };

  var ratio = function (el) {
    var fg = luminance(getComputedStyle(el).color);
    var bg = luminance(painted(el));
    return (Math.max(fg, bg) + 0.05) / (Math.min(fg, bg) + 0.05);
  };

  var report = [];
  var slides = document.querySelectorAll('.gp-slide');
  for (var i = 0; i < slides.length; i++) {
    location.hash = '#' + (i + 1);
    await wait(60);
    var slide = slides[i];
    var overflows = slide.scrollHeight > slide.clientHeight + 4;

    // EVERY text element, not the first. See repair 1 above.
    var texts = slide.querySelectorAll('h1, h2, h3, p, li, blockquote, td, th, figcaption');

    // An empty element has no rendered text to be legible or otherwise, and a
    // ratio taken from one is noise that would drag the worst-case figure to a
    // value no reader ever sees.
    //
    // AND NOTHING INSIDE AN <svg>. painted() walks DOM ANCESTORS, but a mermaid
    // node label lives in a <foreignObject> whose background is an SVG <rect>
    // SIBLING -- so the walk sails past the pale node fill the text actually
    // sits on and lands on the slide. blueprint's diagram labels measured 1.3:1
    // that way and are perfectly legible on screen.
    //
    // That false red arrived WITH repair 1: widening the selector reached into
    // the SVG and produced numbers that read exactly like contrast readings
    // while measuring text against a background it is not on. Third time the
    // adjacency has landed inside the check written to catch adjacency.
    //
    // A diagram is not skipped, it is DECLARED UNMEASURED. This probe cannot
    // speak for SVG-painted backgrounds and says so, rather than inventing a
    // ratio or staying quiet -- the mermaid palette needs its own check, not a
    // borrowed one.
    var measurable = [];
    var diagram = 0;
    for (var j = 0; j < texts.length; j++) {
      if (texts[j].textContent.trim().length === 0) { continue; }
      if (texts[j].closest('svg')) { diagram++; continue; }
      measurable.push(texts[j]);
    }

    if (measurable.length === 0) {
      // See repair 2. A slide this probe cannot speak for says so, out loud,
      // and AT08 counts it. Silence here is how a diagram-only slide passed a
      // legibility check that never looked at it.
      report.push((i + 1) + ':UNMEASURED' + (diagram ? '/DIAGRAM' : '') + (overflows ? '/OVERFLOW' : ''));
      continue;
    }

    var worst = ratio(measurable[0]);
    for (var k = 1; k < measurable.length; k++) {
      var r = ratio(measurable[k]);
      if (r < worst) { worst = r; }
    }

    report.push((i + 1) + ':' + worst.toFixed(1) +
      (diagram ? '/DIAGRAM-UNMEASURED' : '') + (overflows ? '/OVERFLOW' : ''));
  }
  document.getElementById('probe').textContent = report.join(' ');
})();
</script>
