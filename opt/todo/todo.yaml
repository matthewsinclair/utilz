name: todo
version: 1.0.0
utilz_version: "^2.0.0"
description: Simple DOING/TODO/DONE manager for a plain-text todo.md
author: Matthew Sinclair

dependencies:
  - name: jq
    required: false
    install: brew install jq
    purpose: JSON output (todo --json)

# Editor integration (see ST0007). `todo` is stateful, not a region transform:
# the bridge runs it with no input and shows the rendered list in a buffer.
