name: utilz
version_file: ../../VERSION
description: Universal utilities framework and dispatcher
author: Matthew Sinclair
website: https://matthewsinclair.com
help_file: ../../help/utilz.md

# yq is the framework's only YAML parser: every metadata read goes through
# get_util_metadata in opt/utilz/lib/common.sh. It is required, not optional.
# A grep-based fallback used to stand in for it, answering four hardcoded
# queries and returning empty for everything else, which a caller could not
# tell apart from an absent key.
dependencies:
  - name: yq
    install: brew install yq
    purpose: Parse utility metadata (opt/<name>/<name>.yaml)

# Optional dependencies for enhanced functionality
optional_dependencies:
  - name: glow
    install: brew install glow
    purpose: Beautiful markdown rendering for help documentation
  - name: bat
    install: brew install bat
    purpose: Fallback markdown syntax highlighting for help
  - name: bats-core
    install: brew install bats-core
    purpose: Run test suite with 'utilz test'

# Framework metadata
framework:
  is_core: true
  provides:
    - dispatcher
    - common_library
    - test_runner
