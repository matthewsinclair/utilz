name: stampz
version: 1.0.0
utilz_version: "^2.0.0"
description: Stamp a recipient watermark across every page of a PDF pack
author: Matthew Sinclair
dependencies:
  - name: qpdf
    required: true
    install: brew install qpdf
    purpose: Applies the watermark page over every page of each PDF
  - name: pdfinfo
    required: true
    install: brew install poppler
    purpose: Page geometry and page count (ships in poppler)
  - name: pdftoppm
    required: true
    install: brew install poppler
    purpose: Renders pages for the visibility checks in the test suite (ships in poppler)

