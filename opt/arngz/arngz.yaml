name: arngz
version_file: VERSION
utilz_version: "^2.0.0"
description: Named window arrangements (desks) across displays and spaces
author: Matthew Sinclair
dependencies:
  - name: yq
    required: true
    install: brew install yq
    purpose: Reads and validates desks
  - name: hs
    platforms: [macos]
    required: false
    install: arngz init --yes (installs Hammerspoon's hs tool under /opt/homebrew)
    purpose: Hammerspoon's command-line tool; needed by arngz apply and discover
  # An APP, not a command: `app:` makes doctor look it up by bundle id through
  # LaunchServices (common.sh check_app) instead of on PATH.
  - name: Hammerspoon
    app: org.hammerspoon.Hammerspoon
    required: false
    install: brew install --cask hammerspoon
    purpose: The engine that observes and arranges windows; needed by arngz apply and discover

# Editor integration capability declaration (see ST0007). Uncomment to
# expose this utility to external integrators like the Doom Emacs bridge
# (`M-x utilz`) or future VSCode / Zed / Vim plugins. Without this block
# the utility is absent from any integration's command menu.
# integration:
#   input: stdin      # stdin | file | path | none
#   output: buffer    # replace | buffer | message | discard
#   flags: []
