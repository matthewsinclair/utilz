# utilz -- devbin configuration.
#
# Written by: devbin install. Every key, annotated, is vendored beside this
# file at bin/.devbin/lib/config.reference.yaml.

project:
  name: utilz
  # **THIS IS THE SECOND PLACE THIS PROJECT DECLARES ITS LANGUAGES**, and the
  # two are read by different arms of one command: devbin's own gates activate
  # off THIS file, while `check critic` reads `intent/.config/config.json`.
  # Kept in step by hand until devbin#0062 removes one of them; if you change
  # one, change both.
  #
  # Silence here does not disable a gate loudly -- it removes it from `check
  # all` entirely, which still prints "all check options passed" over whatever
  # survived. Measured on this tree 2026-09-09: `autotests` was absent from the
  # run and nothing named it.
  languages:
    - shell
    - rust

# The devbin this project expects. Enforced by: devbin doctor
devbin_version: "^0.1.0"

# devbin's built-in `test rust` and `test shell` assume a root Cargo.toml and a
# root tests/ directory. Utilz has neither: the one crate is under
# opt/prez/crate, and each utility keeps its BATS suite in opt/<name>/test/.
# The rust line is exactly what `utilz test` runs for a crate.
commands:
  test:
    options:
      rust:
        run: cargo test --workspace --no-fail-fast --manifest-path opt/prez/crate/Cargo.toml
        grammar: cargo
        log: RUST
      shell:
        run: bats opt/*/test
        grammar: shell
        log: SHELL
      # The estate: every suite a hand release runs, through the one driver
      # that discovers them -- the bats suites, the workspace's cargo tests and
      # each crate/test/*.sh black-box suite (ST0019 D1). It is the release
      # core's gate, `test estate`, so the release gate is the hand gate by
      # construction. Out of `test all`, reported there as skipped, so the
      # everyday verb never needs video.sh's Chrome, ffmpeg and quiet machine.
      # `generic` because utilz test prints its own summary, which no devbin
      # counter reads; its exit status is the verdict.
      estate:
        summary: Every suite, as a release runs them
        run: bin/utilz test
        grammar: generic
        log: ESTATE
        in_all: false
  # Same layout, same fix, for clippy. --workspace for the reason `utilz test`
  # gives: without it cargo lints the root package alone and every other crate
  # is silently skipped.
  check:
    options:
      clippy:
        run: cargo clippy --workspace --all-targets --manifest-path opt/prez/crate/Cargo.toml -- -D warnings
        grammar: cargo
        log: CLIPPY
      # The check side of `fmt rust` below: the same command line with --check.
      # Utilz formats one language, so this declaration is the whole gate.
      format:
        run: cargo fmt --all --check --manifest-path opt/prez/crate/Cargo.toml
        grammar: generic
        log: FORMAT
  # rustfmt, adopted for the prez crate on hv's ruling (issue 0036), with
  # opt/prez/crate/rustfmt.toml holding tab_spaces = 2. The catalogue's bare
  # `cargo fmt` cannot find a crate that is not at the root, so this arm runs
  # with --manifest-path, as `test rust` and `check clippy` do. That override
  # is why `check format` above declares its own command line: devbin will not
  # derive a check for an overridden arm (builtin_check_format).
  fmt:
    options:
      rust:
        run: cargo fmt --all --manifest-path opt/prez/crate/Cargo.toml
        grammar: generic
        log: FMTRS
