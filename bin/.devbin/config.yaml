# utilz -- devbin configuration.
#
# Written by: devbin install. Every key, annotated, is vendored beside this
# file at bin/.devbin/lib/config.reference.yaml.

project:
  name: utilz
  # **THIS IS THE SECOND PLACE THIS PROJECT DECLARES ITS LANGUAGES**, and the
  # two are read by different arms of one command: devbin's own gates activate
  # off THIS file, while `check critic` reads `intent/.config/config.json`.
  # Kept in step by hand until devbin#0062 removes one of them; if you change
  # one, change both.
  #
  # Silence here does not disable a gate loudly -- it removes it from `check
  # all` entirely, which still prints "all check options passed" over whatever
  # survived. Measured on this tree 2026-09-09: `autotests` was absent from the
  # run and nothing named it.
  languages:
    - shell
    - rust

# The devbin this project expects. Enforced by: devbin doctor
devbin_version: "^0.1.0"

# devbin's built-in `test rust` and `test shell` assume a root Cargo.toml and a
# root tests/ directory. Utilz has neither: the one crate is under
# opt/prez/crate, and each utility keeps its BATS suite in opt/<name>/test/.
# The rust line is exactly what `utilz test` runs for a crate.
commands:
  test:
    options:
      rust:
        run: cargo test --workspace --no-fail-fast --manifest-path opt/prez/crate/Cargo.toml
        grammar: cargo
      shell:
        run: bats opt/*/test
        grammar: shell
      # The estate: every suite a hand release runs, through the one driver
      # that discovers them -- the bats suites, the workspace's cargo tests and
      # each crate/test/*.sh black-box suite (ST0019 D1). It is the release
      # core's gate, `test estate`, so the release gate is the hand gate by
      # construction. Out of `test all`, reported there as skipped, so the
      # everyday verb never needs video.sh's Chrome, ffmpeg and quiet machine.
      # `generic` because utilz test prints its own summary, which no devbin
      # counter reads; its exit status is the verdict.
      estate:
        summary: Every suite, as a release runs them
        # tools/test-estate, not bin/utilz test directly: it re-execs the
        # dispatcher with /bin first on PATH, so bats and every suite run under
        # the bash 3.2.57 macOS ships. hv's uniform CI ruling took the macOS
        # legs off every push, to a release's candidate push and manual runs,
        # and this is the 3.2 run that stood between a green tree and a tag
        # (issue 0051).
        run: tools/test-estate
        grammar: generic
        log: ESTATE
        in_all: false
  # Same layout, same fix, for clippy. --workspace for the reason `utilz test`
  # gives: without it cargo lints the root package alone and every other crate
  # is silently skipped.
  check:
    options:
      clippy:
        run: cargo clippy --workspace --all-targets --manifest-path opt/prez/crate/Cargo.toml -- -D warnings
        grammar: cargo
      # The check side of `fmt rust` below: the same command line with --check.
      # Utilz formats one language, so this declaration is the whole gate.
      format:
        run: cargo fmt --all --check --manifest-path opt/prez/crate/Cargo.toml
        grammar: generic
  # rustfmt, adopted for the prez crate on hv's ruling (issue 0036), with
  # opt/prez/crate/rustfmt.toml holding tab_spaces = 2. The catalogue's bare
  # `cargo fmt` cannot find a crate that is not at the root, so this arm runs
  # with --manifest-path, as `test rust` and `check clippy` do. That override
  # is why `check format` above declares its own command line: devbin will not
  # derive a check for an overridden arm (builtin_check_format).
  fmt:
    options:
      rust:
        run: cargo fmt --all --manifest-path opt/prez/crate/Cargo.toml
        grammar: generic
  # Devbin's release core, switched on by hv's OK of 2026-09-21 (ST0019 D1,
  # Devbin ST0007 WP-08). Its first act, before any cut, is the read-only
  # `bin/devbin release check`. Its declaration is the release: block below.
  # The build bin/devbin build runs, and bin/devbin install before it
  # publishes (devbin#0326): prez and showreel, the one crate's two binaries,
  # which the runtime set ships. --workspace builds both, as utilz test
  # reads them, and --locked holds the build to Cargo.lock.
  build:
    run: cargo build --release --workspace --locked --manifest-path opt/prez/crate/Cargo.toml
  release:
    enabled: true
  # devbin's formula built-in, opt-in as release is: it renders
  # packaging/homebrew/utilz.rb for a release and publishes it to the tap.
  # Its declaration is the formula: block below.
  formula:
    enabled: true
  # Menuz.app's release half is devbin's built-in macos, declared in the macos:
  # block below (issue 0118). Rasterising its icon is Utilz's own, so it is a
  # declared option, which routes before any word reaches the built-in, and
  # its doctor lines are a check of their own. Both are out of `macos all`.
  macos:
    enabled: true
    options:
      app-icons:
        summary: Rasterise menuz.svg and menuz-mark.svg into the asset catalogue
        run: tools/app-icons
        in_all: false
      app-icons-check:
        summary: rsvg-convert, both SVGs and the asset catalogue, for app-icons
        run: tools/app-icons --check
        in_all: false

# Menuz.app, signed, notarised and attached to the release by the built-in
# macos (issue 0118). Menuz versions apart from Utilz, from opt/menuz/VERSION,
# so its commit stamp is what shows a copy is the tag's build, and its kind
# stamp follows the rule help/menuz.md states. It builds under XDG
# state, outside the tree, because Launch Services registers bundles left
# under ~/Devel (issue 0106). bundle_id is a second copy of
# opt/menuz/lib/launch-services.sh's MENUZ_BUNDLE_ID, held equal by
# macos.bats. Notarisation reads the one notarytool keychain profile that
# store-creds saves, macos.notary_profile, left at its default (devbin).
macos:
  app: ${XDG_STATE_HOME}/menuz/build/macos/Build/Products/Release/Menuz.app
  build: bin/utilz menuz build --release
  bundle_id: com.matthewsinclair.utilz.menuz
  entitlements: native/macos/Menuz/Menuz/Menuz.entitlements
  version_from: opt/menuz/VERSION
  commit_stamp: MenuzCommit
  kind_stamp: MenuzKind
  kind_value: release
  build_root: ${XDG_STATE_HOME}/menuz/build/macos

# The release core's declaration (ST0019 design D1): only what differs from the
# defaults in lib/config.reference.yaml. commands.release.enabled above is what
# switches the core on; this block alone would be inert.
#
# tag: bare, hv's ruling at 2.7.0. repo: declared because the core refuses
# without it -- no origin and two remotes (local, upstream). gates: check all
# alone (hv, 28 Oct 2026, ST0030), test estate running before a cut and not in
# it; the ruling rested on the dry run and the twins running the suites, and at
# devbin 0.1.28 a dry run runs no gate, so that is the twins' run (ST0031/01).
# formula: true, the core's formula step (issue I59c806c), which runs
# `bin/devbin formula publish --pull` once the release object has succeeded:
# it publishes the formula to the tap, then pulls this machine's clone of it.
# The Menuz.app the cut's macos leg signed is attached before it, by the
# core's own object step (issue 0329), and a failed attach ends the cut before
# the formula step, so the formula never reaches the tap ahead of the app. No
# after: line, since the step is the core's. No ci block: from devbin 0.1.19
# the core's built-in ci-state reads CI itself, on the candidate's run of
# tests.yml, its default workflow.
release:
  tag: "{version}"
  repo: matthewsinclair/utilz
  gates:
    - check all
  formula: true

# The formula built-in's declaration, in source mode: brew builds from the
# release tag's checkout, so packaging/homebrew/utilz.rb, the default template,
# holds one placeholder for the tag and one for its commit, and its install is
# @@INSTALL@@, which render fills with the core's publish. tap: Utilz's tap,
# over https, as Homebrew names it (brew tap matthewsinclair/utilz).
formula:
  mode: source
  tap: https://github.com/matthewsinclair/homebrew-utilz.git

# utilz itself, for devbin's dev/opt/brew (devbin#0326): run in this checkout,
# `bin/devbin install` publishes the opt tree at the prefix, and
# `bin/devbin use dev|opt|brew` points the link set in ~/.local/bin at a tree.
# The formula's @@INSTALL@@ publishes the keg the same way.
#
# manifest: manifest.sha256, the name every reader already takes (prez's
# shim, menuz, run_tests' refusal, doctor and the version line), as
# UTILZ_MANIFEST_NAME in opt/utilz/lib/common.sh.
#
# links: utilz and every bin/<name> link to it, the utilities each_utility
# finds. Each is a link in the tree, so every one runs the one dispatcher.
#
# files: the runtime set, as utilz_runtime_set in common.sh names it: what git
# tracks under bin, opt, help, static and VERSION, less bin/devbin, bin/.devbin,
# each utility's test/ and the prez crate, and then the crate's two binaries,
# which commands.build makes, and its Cargo.toml, which prez.yaml reads its
# version from. Each directory entry ships what git tracks below it, less its
# excludes (devbin I2bae9ce).
install:
  prefix: ~/Devel/opt/utilz
  manifest: manifest.sha256
  links:
    utilz: bin/utilz
    arngz: bin/arngz
    cleanz: bin/cleanz
    clipz: bin/clipz
    cryptz: bin/cryptz
    expz: bin/expz
    gitz: bin/gitz
    lnrel: bin/lnrel
    macoz: bin/macoz
    mdagg: bin/mdagg
    menuz: bin/menuz
    pdf2md: bin/pdf2md
    prez: bin/prez
    retry: bin/retry
    stampz: bin/stampz
    syncz: bin/syncz
    todo: bin/todo
    xtrct: bin/xtrct
  files:
    bin:
      path: bin
      excludes:
        - devbin
        - ".devbin/**"
    opt:
      path: opt
      excludes:
        - "*/test/**"
        - "prez/crate/**"
    help:
      path: help
    static:
      path: static
    version:
      path: VERSION
    prez-toml:
      path: opt/prez/crate/Cargo.toml
    prez:
      path: opt/prez/crate/target/release/prez
    showreel:
      path: opt/prez/crate/target/release/showreel
